---
- name: Amazon Bedrock AgentCore Memory integration tests
  module_defaults:
    group/amazon.ai.aws:
      access_key: "{{ aws_access_key }}"
      secret_key: "{{ aws_secret_key }}"
      session_token: "{{ security_token | default(omit) }}"
      region: "{{ aws_region }}"
    group/aws:
      access_key: "{{ aws_access_key }}"
      secret_key: "{{ aws_secret_key }}"
      session_token: "{{ security_token | default(omit) }}"
      region: "{{ aws_region }}"
  block:
    - ansible.builtin.include_tasks: setup.yml
    - ansible.builtin.include_tasks: create.yml
    - ansible.builtin.include_tasks: update.yml
    - ansible.builtin.include_tasks: strategies.yml
    - ansible.builtin.include_tasks: keys.yml
    - ansible.builtin.include_tasks: stream_delivery.yml
    - ansible.builtin.include_tasks: tags.yml
    - ansible.builtin.include_tasks: create_only.yml
    - ansible.builtin.include_tasks: delete.yml
    - ansible.builtin.include_tasks: no_wait.yml
  always:
    - ansible.builtin.include_tasks: teardown.yml
